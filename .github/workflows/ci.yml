name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pms_test
          POSTGRES_USER: pms
          POSTGRES_PASSWORD: pms
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pms -d pms_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint, check migrations, collectstatic, and run pytest on PostgreSQL
        env:
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: "ci-test-secret-key-with-at-least-32-bytes-length"
          DATABASE_URL: "postgres://pms:pms@localhost:5432/pms_test"
        run: |
          ruff check .
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py collectstatic --no-input
          pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install, lint, typecheck, and build Next.js app
        run: |
          npm ci
          npm run lint
          npx tsc --noEmit
          npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json
      - name: Install and typecheck Expo app
        run: |
          npm ci
          npx tsc --noEmit

  e2e:
    needs: [backend, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install backend and web dependencies
        run: |
          pip install -r backend/requirements.txt
          cd web && npm ci && npx playwright install chromium
      - name: Run Playwright browser E2E suite
        env:
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: "ci-e2e-secret-key-with-at-least-32-bytes-length"
          DATABASE_URL: "sqlite:///db_e2e.sqlite3"
          NEXT_PUBLIC_API_BASE_URL: "http://127.0.0.1:8000/api/v1"
        run: |
          cd backend
          python manage.py migrate
          python manage.py seed_dev --force
          python manage.py runserver 127.0.0.1:8000 &
          BACK_PID=$!
          cd ../web
          npm run build
          npx next start -H 127.0.0.1 -p 3000 &
          WEB_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health/ >/dev/null && curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              break
            fi
            sleep 1
          done
          npm run test:e2e
          STATUS=$?
          kill $BACK_PID $WEB_PID || true
          exit $STATUS

  trigger-deploy:
    needs: [backend, web, mobile, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook (if configured)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"
          else
            echo "No RENDER_DEPLOY_HOOK_URL secret set; relying on Render/Vercel GitHub auto-deploy."
          fi
