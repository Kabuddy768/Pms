services:
  - type: web
    name: pms-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.2"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pms-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SEED_DEV_DATA
        value: "true"

databases:
  - name: pms-db
    databaseName: pms
    user: pms
    plan: free
